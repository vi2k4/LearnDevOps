name: Fullstack CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"
          cache-dependency-path: WebChat/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./WebChat
        run: npm ci

      - name: Build frontend
        working-directory: ./WebChat
        run: npm run build

  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: LearnDevOps
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d LearnDevOps"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Build Spring Boot
        working-directory: ./LearnDevOps
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/LearnDevOps
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
          SPRING_JPA_SHOW_SQL: "false"
          SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "false"
          JWT_SECRET_KEY: abcdefghijklmnopqrstuvwxyz123456
        run: ./mvnw -B clean verify
